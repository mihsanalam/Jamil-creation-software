name: ci

# Tier 4 — item 23. Runs on PRs so a broken test or type error can't land.
# The gate mirrors exactly what `npm run` exposes locally: typecheck, lint, test.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        # Vitest runs in a node env (no DB needed) — see vitest.config.ts.
        run: npm test
